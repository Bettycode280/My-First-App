<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GW Mission Control</title>

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json?v=11">
    <link rel="apple-touch-icon" href="gw-logo.png?v=11">
    <link rel="icon" type="image/png" href="gw-logo.png?v=11">
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#051923">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* SCROLL & VIEWPORT FIX */
        html, body {
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: #051923;
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Prevent body scroll to keep header stagnant */
        }

        /* Security Overlay */
        #login-overlay {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #051923; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            z-index: 2000;
        }

        /* Layout Container */
        .admin-container { 
            padding-top: calc(20px + env(safe-area-inset-top)); 
            padding-left: 20px;
            padding-right: 20px;
            display: none; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        /* Sticky Toggle Bar */
        .toggle-container { 
            flex-shrink: 0; /* Keep bar from squishing */
            display: flex; 
            gap: 10px; 
            background: #051923; 
            padding: 15px 0; 
        }

        .toggle-btn {
            flex: 1; 
            padding: 14px; 
            border-radius: 10px; 
            border: none;
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-active-style { background: #00d4ff; color: #051923; }
        .btn-inactive-style { background: #1a3a4a; color: white; border: 1px solid #00d4ff; }

        /* The scrolling list area (The "Folder") */
        #mission-list {
            flex-grow: 1;
            overflow-y: auto; 
            padding-bottom: 40px;
            -webkit-overflow-scrolling: touch;
        }

        .mission-card { 
            background: #1a3a4a; 
            border-left: 8px solid #00d4ff; 
            margin-bottom: 15px; 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style> 
</head>
<body>

    <div id="login-overlay">
        <div style="text-align:center; width: 85%; max-width: 320px;">
            <img src="gw-logo.png?v=9" style="width:100px; height:100px; border-radius:50%; margin-bottom:20px; border: 3px solid #00d4ff; object-fit: cover;">
            <h2 style="margin-bottom:20px;">Command Center</h2>
            <input type="password" id="pass-input" placeholder="Access Code" 
                   style="padding:15px; width:100%; border-radius:8px; border:none; margin-bottom:15px; font-size:18px; color: #000;">
            <button class="toggle-btn btn-active-style" onclick="checkPass()" style="width:100%;">Enter Mission Control</button>
        </div>
    </div>

    <div class="admin-container" id="admin-ui" style="display: none;">
        <h1 style="margin: 0; padding-top: 10px; font-size: 1.8rem;">🛠️ Mission Control</h1>
        
        <div class="toggle-container">
            <button class="toggle-btn btn-active-style" id="tab-active" onclick="displayMissions()">Active</button>
            <button class="toggle-btn btn-inactive-style" id="tab-archive" onclick="showArchiveData()">Archive</button>
        </div>

        <div id="mission-list">
            <p style="text-align:center; opacity:0.5;">Connecting to secure server...</p>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        // Redirect checkPass to the one in script.js for consistency
        const internalCheck = () => {
            if(typeof checkPass === "function") {
                checkPass();
            }
        };
    </script>
</body>
</html>
