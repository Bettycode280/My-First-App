
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Mission Control</title>
    
    <!-- App Icon Links -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { padding: 20px; max-width: 800px; margin: auto; display: none; } /* Hidden by default */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #051923; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .login-box { background: #1a3a4a; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        input { padding: 12px; border-radius: 5px; border: none; width: 200px; margin-bottom: 10px; font-size: 16px; }
        .login-btn { background: #00d4ff; color: #051923; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .mission-card { background: #1a3a4a; border-left: 10px solid #00d4ff; margin-bottom: 20px; padding: 20px; border-radius: 12px; }
        .priority-high { border-left-color: #ff4b2b; }
        .priority-medium { border-left-color: #ffb400; }
        .priority-low { border-left-color: #00ff88; }
        .delete-btn { background: #ff4b2b; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body style="background: #051923; color: white; font-family: 'Inter', sans-serif;">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <img src="logo.png" alt="Logo" style="width: 80px; margin-bottom: 20px;">
            <h2>Command Center</h2>
            <input type="password" id="pass-input" placeholder="Enter Command Code">
            <br>
            <button class="login-btn" onclick="checkPass()">Access Missions</button>
            <p id="error-msg" style="color: #ff4b2b; display: none; margin-top: 10px;">Access Denied</p>
        </div>
    </div>

    <!-- MAIN CONTENT (Hidden until login) -->
    <div class="admin-container" id="admin-ui">
        <h1>🛠️ Mission Control</h1>
        <p>Active Requests</p>
        <hr style="opacity: 0.2; margin-bottom: 30px;">
        <div id="mission-list">
            <p>Scanning database...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function checkPass() {
            const code = document.getElementById('pass-input').value;
            // CHANGE '1234' TO YOUR SECRET CODE BELOW
            if (code === '1234') { 
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-ui').style.display = 'block';
                if (typeof displayMissions === "function") {
                    displayMissions();
                }
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
