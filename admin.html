
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GW Mission Control</title>
    
    <!-- ICON RECOVERY: Points to your logo.png in the main folder -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* SCROLL & VIEWPORT FIX */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #051923;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        /* Security Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #051923; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
        }

        /* Layout Container */
        .admin-container { 
            padding: 20px; 
            display: none; 
            /* This ensures you can scroll past the last card */
            padding-bottom: 120px; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Sticky Toggle Bar */
        .toggle-container { 
            position: sticky; 
            top: 0; 
            z-index: 100;
            display: flex; 
            gap: 10px; 
            background: #051923; 
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .toggle-btn {
            flex: 1; padding: 14px; border-radius: 10px; border: none;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }
        
        .btn-active-style { background: #00d4ff; color: #051923; }
        .btn-inactive-style { background: #1a3a4a; color: white; border: 1px solid #00d4ff; }

        /* Card Styling */
        .mission-card { 
            background: #1a3a4a; 
            border-left: 8px solid #00d4ff; 
            margin-bottom: 15px; 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div style="text-align:center; width: 85%; max-width: 320px;">
            <img src="logo.png" style="width:100px; border-radius:50%; margin-bottom:20px; border: 3px solid #00d4ff;">
            <h2 style="margin-bottom:20px;">Command Center</h2>
            <input type="password" id="pass-input" placeholder="Access Code" 
                   style="padding:15px; width:100%; border-radius:8px; border:none; margin-bottom:15px; font-size:18px;">
            <button class="toggle-btn btn-active-style" onclick="checkPass()" style="width:100%;">Enter Mission Control</button>
        </div>
    </div>

    <div class="admin-container" id="admin-ui">
        <h1 style="margin-top: 10px;">🛠️ Mission Control</h1>
        
        <div class="toggle-container">
            <button class="toggle-btn btn-active-style" id="tab-active" onclick="showActive()">Active</button>
            <button class="toggle-btn btn-inactive-style" id="tab-archive" onclick="showArchive()">Archive</button>
        </div>

        <div id="mission-list">
            <p style="text-align:center; opacity:0.5;">Establishing secure link...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function checkPass() {
            const code = document.getElementById('pass-input').value;
            // CHANGE THIS TO YOUR SECRET CODE
            if (code === '1234') { 
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-ui').style.display = 'block';
                if (typeof displayMissions === "function") {
                    displayMissions();
                }
            } else {
                alert("Unauthorized Access");
            }
        }

        function showActive() {
            document.getElementById('tab-active').className = 'toggle-btn btn-active-style';
            document.getElementById('tab-archive').className = 'toggle-btn btn-inactive-style';
            if (typeof displayMissions === "function") { displayMissions(); }
        }

        function showArchive() {
            document.getElementById('tab-archive').className = 'toggle-btn btn-active-style';
            document.getElementById('tab-active').className = 'toggle-btn btn-inactive-style';
            if (typeof showArchiveData === "function") { 
                showArchiveData(); 
            } else {
                // Fallback if the function is still in script.js
                const list = document.getElementById('mission-list');
                list.innerHTML = "<p>Opening Archives...</p>";
                db.collection("completedMissions").orderBy("completedAt", "desc").get().then((snapshot) => {
                    list.innerHTML = "";
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const card = document.createElement('div');
                        card.className = 'mission-card';
                        card.style.borderLeftColor = '#555';
                        card.innerHTML = `<h3>${data.name} (ARCHIVED)</h3><p>${data.mission}</p>`;
                        list.appendChild(card);
                    });
                });
            }
        }
    </script>
</body>
</html>
